# shellcheck shell=bash
# =============================================================================
#  app.conf — nơi DUY NHẤT cần sửa khi đổi tên / repo / đường dẫn của dự án
# =============================================================================
APP_NAME="cartoon-shell"                 # dùng cho thư mục state, log, lock
APP_TITLE="Cartoon Shell"                # tên hiển thị trên giao diện

# Repo chứa cấu hình Quickshell sẽ được clone vào ~/.config/quickshell/<tên>
SHELL_REPO_URL="${SHELL_REPO_URL:-https://github.com/lesang2312/cartoon-shell_mod}"
SHELL_TARGET_DIR="$HOME/.config/quickshell/cartoon-shell"


# Dung lượng trống tối thiểu (MB) ở / để cảnh báo trước khi cài
MIN_FREE_MB=4096

# Các thư mục người dùng chuẩn sẽ được tạo
USER_DIRS=(Music Documents Downloads Pictures Videos Desktop Public Templates)

# BigBlue Terminal Nerd Font — tải online từ bản phát hành Nerd Fonts, cài vào /usr/share/fonts
BIGBLUE_URL="${BIGBLUE_URL:-https://github.com/ryanoasis/nerd-fonts/releases/latest/download/BigBlueTerminal.zip}"
BIGBLUE_DIR="/usr/share/fonts/BigBlueTerminalNerdFont"

# ---- Nguồn ONLINE (đặt biến = rỗng để tắt, hoặc dùng --skip dotfiles,wallpapers) -------------------------------
# Toàn bộ dữ liệu đều lấy từ mạng, bộ cài không đóng kèm file cấu hình/ảnh/font.
# Repo dotfiles: các mục cấp 1 trong thư mục DOTFILES_SUBDIR sẽ được chép vào ~/.config
DOTFILES_REPO_URL="${DOTFILES_REPO_URL:-https://github.com/lesang2312/dotfiles-hyprland_mod}"
DOTFILES_SUBDIR="${DOTFILES_SUBDIR:-.config}"
# Hình nền: ảnh trong WALLPAPERS_SUBDIR của repo (mặc định cùng repo dotfiles, thư mục Pictures/Wallpapers)
# → ~/Pictures/Wallpapers. Nếu thư mục đó không có thì dùng images/, rồi tới cả repo.
WALLPAPERS_REPO_URL="${WALLPAPERS_REPO_URL:-$DOTFILES_REPO_URL}"
WALLPAPERS_SUBDIR="${WALLPAPERS_SUBDIR:-Pictures/Wallpapers}"

# ---- Màn hình đăng nhập SDDM (tự động cài, không cần chọn) -----------------------------------------------------
# Theme "cartoon" nằm trong repo cartoon-shell (SHELL_REPO_URL) → chép vào /usr/share/sddm/themes/cartoon
SDDM_THEME_NAME="${SDDM_THEME_NAME:-cartoon}"
SDDM_THEME_SRC_SUBDIR="${SDDM_THEME_SRC_SUBDIR:-sddm/themes/cartoon}"   # đường dẫn trong repo shell
SDDM_THEMES_DIR="/usr/share/sddm/themes"
SDDM_CONF_FILE="/etc/sddm.conf.d/10-cartoon-shell.conf"
